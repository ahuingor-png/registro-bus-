function render(){ const s=state; const isDark = s.theme==="dark"; document.documentElement.classList.toggle("dark", isDark); document.body.className = isDark ? "bg-zinc-950" : "bg-zinc-50"; const occSet=new Set(s.registros.map(r=>r.asiento));

  const cambio=s.cambioId? s.registros.find(r=>r.id===s.cambioId):null;
  const libresArr=[]; for(let i=1;i<=40;i++) if(!occSet.has(i)) libresArr.push(i);

  root.innerHTML=`<div class="min-h-screen max-w-[720px] mx-auto pb-10">
  <header class="sticky top-0 z-20 ${isDark?'bg-zinc-900/90 border-zinc-800':'bg-white/90 border-zinc-200'} backdrop-blur border-b">

    </div>
    <button id="btnPasajeros" type="button" class="w-full bg-white rounded-[20px] border p-4 shadow-sm flex items-center justify-between text-left"><div><h2 class="font-semibold text-[14px]">Pasajeros (${occ})</h2><p class="text-[11px] text-zinc-500 mt-0.5">Ver, buscar y gestionar registros</p></div><span class="text-zinc-400 text-[18px]">›</span></button>
  </div></div>
  ${info?`<div id="mInfo" class="fixed inset-0 z-40 flex items-end justify-center p-4 bg-black/40"><div class="w-full max-w-[420px] ${isDark?'bg-zinc-900 text-zinc-100':'bg-white'} rounded-[20px] p-4"><div class="flex justify-between"><div><p class="font-semibold">Asiento ${info.asiento}</p><p class="text-[12px] text-zinc-500">${info.nombre}</p></div><button data-closeInfo class="w-8 h-8 rounded-full bg-zinc-100">✕</button></div><div class="mt-3 grid grid-cols-2 gap-2"><div class="bg-zinc-50 border rounded-xl p-3"><p class="text-[10px] uppercase text-zinc-500">Área</p><p class="text-[13px]">${info.area}</p></div><div class="bg-zinc-50 border rounded-xl p-3"><p class="text-[10px] uppercase">Líder</p><p class="text-[13px]">${info.lider}</p></div></div><div class="mt-2 bg-zinc-50 border rounded-xl p-3"><p class="text-[10px] uppercase text-zinc-500">Celular</p><p class="text-[13px]"><a href="tel:${info.celular}" class="text-blue-600 font-semibold">${info.celular||'No registrado'}</a> ${info.celular?`<a href="https://wa.me/51${info.celular}" target="_blank" class="ml-2 text-[10px] bg-green-500 text-white px-2 py-1 rounded-full">WhatsApp</a>`:''}</p></div><div class="mt-3 flex gap-2"><button data-editInfo="${info.id}" class="flex-1 h-11 rounded-xl bg-zinc-900 text-white">Editar</button><button data-changeInfo="${info.id}" class="flex-1 h-11 rounded-xl border">Cambiar</button></div></div></div>`:''}
  ${cambio?`<div id="mCambio" class="fixed inset-0 z-50 flex items-end justify-center p-4 bg-black/40"><div class="w-full max-w-[420px] ${isDark?'bg-zinc-900 text-zinc-100':'bg-white'} rounded-[20px] p-4"><div class="flex justify-between"><p class="font-semibold text-[14px]">Cambiar asiento de ${cambio.nombre}</p><button data-closeCambio class="w-8 h-8 rounded-full bg-zinc-100">✕</button></div><select id="selNuevo" class="mt-3 w-full h-11 px-3 rounded-xl border"><option value="">Elige libre</option>${libresArr.map(n=>`<option value="${n}" ${String(s.nuevoAsiento)===String(n)?'selected':''}>${n}</option>`).join('')}</select><div class="mt-3 grid grid-cols-8 gap-1.5">${Array.from({length:40},(_,i)=>{const n=i+1; const o=occSet.has(n)&&n!==cambio.asiento; const sel=String(s.nuevoAsiento)===String(n); return `<button data-nuevo="${n}" ${o?'disabled':''} class="h-9 rounded-lg text-[12px] border ${o?'bg-zinc-100 text-zinc-300':sel?'bg-zinc-900 text-white':'bg-white'}">${n}</button>`}).join('')}</div><div class="mt-4 flex gap-2"><button data-closeCambio class="flex-1 h-11 rounded-xl border">Cancelar</button><button id="bConfirmCambio" class="flex-1 h-11 rounded-xl bg-zinc-900 text-white" ${!s.nuevoAsiento?'disabled':''}>Confirmar</button></div></div></div>`:''}
  ${s.adminModal?`<div id="mAdmin" class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/50"><div class="w-full max-w-[360px] ${isDark?'bg-zinc-900 text-zinc-100':'bg-white'} rounded-[20px] p-6"><p class="font-semibold text-[14px]">🔒 Acción protegida</p><p class="mt-2 text-[13px] bg-amber-50 border border-amber-200 rounded-xl p-2">${s.adminModal.message}</p><input id="inpAdmin" type="password" placeholder="Clave admin" value="${s.adminInput}" class="mt-4 w-full h-11 px-3 rounded-xl border"/><p class="text-[12px] text-red-600 mt-2">${s.adminError||''}</p><div class="mt-4 flex gap-2"><button data-closeAdmin class="flex-1 h-11 rounded-xl border">Cancelar</button><button id="bAuth" class="flex-1 h-11 rounded-xl bg-zinc-900 text-white">Autorizar</button></div></div></div>`:''}
  ${s.showMapa?`<div id="mMapa" class="fixed inset-0 z-30 flex items-end justify-center p-4 bg-black/40"><div class="w-full max-w-[480px] max-h-[85vh] overflow-auto ${isDark?'bg-zinc-900 text-zinc-100':'bg-white'} rounded-[20px] p-4"><div class="flex items-center justify-between"><h2 class="font-semibold text-[14px]">🚌 Mapa del Bus</h2><button data-closeMapa class="w-8 h-8 rounded-full bg-zinc-100">✕</button></div><div class="mt-1 flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-zinc-500"><span>🔴 Libre</span><span>🟢 Ocupado</span><span>🪟 Ventana</span><span>🚶 Pasillo</span></div><div class="mt-4 grid grid-cols-5 gap-2">${Array.from({length:40},(_,i)=>{const n=i+1; const posEnFila=i%4; const esVentana=posEnFila===0||posEnFila===3; const icono=esVentana?'🪟':'🚶'; const tipo=esVentana?'Ventana':'Pasillo'; const o=occSet.has(n); const f=s.registros.find(r=>r.asiento===n); const btn=`<button data-seat="${n}" title="Asiento ${n} · ${tipo}" class="relative h-[52px] rounded-xl border-2 text-[13px] font-bold flex flex-col items-center justify-center ${o?'bg-green-500 border-green-600 text-white map-seat-ocupado':'bg-red-50 border-red-200 text-red-700 map-seat-libre'}"><span class="absolute top-0.5 right-1 text-[9px] leading-none opacity-80">${icono}</span><span>${n}</span>${o?`<span class="text-[9px] truncate max-w-[60px]">${f?f.nombre.split(' ')[0]:''}</span>`:''}</button>`; return posEnFila===2? `<div class="flex items-center justify-center text-zinc-300 text-[10px]">┊</div>${btn}` : btn;}).join('')}</div></div></div>`:''}
  ${s.showSuccess?`<div id="mSuccess" class="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"><div class="w-full max-w-[360px] ${isDark?'bg-zinc-900 text-zinc-100':'bg-white'} rounded-[24px] p-6 text-center shadow-2xl animate-[pulse_0.3s_ease]"><div class="w-14 h-14 bg-green-100 rounded-full flex items-center justify-center mx-auto text-2xl">✅</div><h3 class="mt-4 font-bold text-[18px] text-zinc-900">¡Todo listo!</h3><p class="mt-2 text-[14px] leading-relaxed text-zinc-600">Ya eres parte de la ruta${s.successNombre?`, <b>${s.successNombre}</b>`:''}. Nos vemos en el bus para compartir, reír y hacer equipo fuera de la oficina. 🚌✨</p><button data-closeSuccess class="mt-5 w-full h-11 rounded-xl bg-zinc-900 text-white font-semibold text-[14px]">¡Genial!</button></div></div>`:''}
  ${s.showPasajeros?`<div id="mPasajeros" class="fixed inset-0 z-30 flex items-end justify-center p-4 bg-black/40"><div class="w-full max-w-[480px] max-h-[85vh] overflow-auto ${isDark?'bg-zinc-900 text-zinc-100':'bg-white'} rounded-[20px] p-4"><div class="flex items-center justify-between gap-2"><h2 class="font-semibold text-[14px]">Pasajeros (${filtrados.length})</h2><div class="flex gap-2"><button id="bexp" class="h-8 px-3 rounded-full border text-[11px]">CSV</button><button id="bclear" class="h-8 px-3 rounded-full bg-red-50 border border-red-200 text-red-700 text-[11px]">Borrar todo</button><button data-closePasajeros class="w-8 h-8 rounded-full bg-zinc-100 shrink-0">✕</button></div></div><input id="fsearch" value="${s.search}" placeholder="Buscar..." class="mt-3 w-full h-10 px-3 rounded-xl border bg-zinc-50 text-[13px]"/><div class="mt-3 space-y-2">${filtrados.length===0?`<p class="text-center py-6 text-zinc-400 text-[13px]">Bus vacío • 0 registros</p>`:filtrados.map(r=>`<div class="flex items-center gap-3 p-3 rounded-xl border bg-zinc-50/50"><div class="w-9 h-9 rounded-full bg-zinc-900 text-white flex items-center justify-center text-[12px] font-bold">${r.asiento}</div><div class="flex-1 min-w-0"><p class="text-[13px] font-semibold truncate">${r.nombre}</p><p class="text-[11px] text-zinc-500 truncate">${r.area} • ${r.lider} ${r.celular?'• 📱 '+r.celular:''}</p></div><div class="flex gap-1"><button data-edit="${r.id}" class="w-8 h-8 rounded-full bg-white border">✏️</button><button data-change="${r.id}" class="w-8 h-8 rounded-full bg-white border">🔄</button><button data-del="${r.id}" class="w-8 h-8 rounded-full bg-red-50 border border-red-200">🗑️</button></div></div>`).join('')}</div></div></div>`:''}
  `;
  bind();
}

function bind(){
  document.querySelectorAll('[data-seat]').forEach(b=> b.addEventListener('click', ()=>{ const n=Number(b.getAttribute('data-seat')); const occ=state.registros.find(r=>r.asiento===n); if(occ){state.infoAsiento=n; render();} else {state.asientoSel=n; state.showMapa=false; render(); document.getElementById('fn')?.focus();}}));
  const fn=document.getElementById('fn'); const fa=document.getElementById('fa'); const fl=document.getElementById('fl'); const fe=document.getElementById('fe'); const fs=document.getElementById('fs');
  if(fn) fn.addEventListener('input', e=> state.nombre=e.target.value);
  if(fa) fa.addEventListener('input', e=> state.area=e.target.value);
  if(fl) fl.addEventListener('input', e=> state.lider=e.target.value);
  if(fe) fe.addEventListener('input', e=> state.dni=e.target.value);
  const fc=document.getElementById('fc');
  if(fc) fc.addEventListener('input', e=> state.celular=e.target.value);
  if(fs) fs.addEventListener('change', e=> state.asientoSel=e.target.value);
  document.getElementById('fsearch')?.addEventListener('input', e=>{state.search=e.target.value; render();});
  document.getElementById('formReg')?.addEventListener('submit', e=>{
    e.preventDefault();
    state.nombre=document.getElementById('fn').value.trim();
    state.area=document.getElementById('fa').value.trim();
    state.lider=document.getElementById('fl').value.trim();
    state.dni=document.getElementById('fe').value.trim();
    state.celular=document.getElementById('fc').value.trim();
    state.asientoSel=document.getElementById('fs').value;
    state.error="";
    if(!state.nombre||!state.area||!state.lider||!state.dni||!state.asientoSel){state.error="Completa todos los campos"; render(); return;}
    if(!/^[0-9]{8}$/.test(state.dni)){state.error="DNI inválido (8 dígitos)"; render(); return;}
    if(state.celular && !/^[0-9]{6,15}$/.test(state.celular.replace(/\s+/g,''))){state.error="Celular inválido (solo números 6-15 dígitos)"; render(); return;}
    const asientoNum=Number(state.asientoSel);
    const existe=state.registros.find(r=>r.asiento===asientoNum && r.id!==state.editId);
    const doSave=()=>{ const id=state.editId||Date.now().toString(); const data={id, nombre:state.nombre, area:state.area, lider:state.lider, dni:state.dni, celular:state.celular, asiento:asientoNum, ts:Date.now()}; if(existe){ remove(ref(db, DB_PATH+'/'+existe.id)); } set(ref(db, DB_PATH+'/'+id), data).then(()=>{
      const nombreGuardado = state.nombre;
      state.nombre=""; state.area=""; state.lider=""; state.dni=""; state.celular=""; state.asientoSel=""; state.editId=null; state.error="";
      if(!state.editId){ // only show on new registration, not edit? Show always but better always
      }
      // Mostrar mensaje de éxito
      state.successNombre = nombreGuardado;
      state.showSuccess = true;
      render();
      setTimeout(()=>{ state.showSuccess=false; render(); }, 4000);
    }); };
    if(existe && !state.isAdmin){ state.adminModal={message:`El asiento ${asientoNum} está ocupado por ${existe.nombre}. Requiere clave admin.`, action:doSave}; state.adminInput=""; state.adminError=""; render(); return; }
    doSave();
  });
  document.getElementById('bcancel')?.addEventListener('click', ()=>{state.editId=null; state.nombre=""; state.area=""; state.lider=""; state.dni=""; state.celular=""; state.asientoSel=""; render();});
  document.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{ const id=b.getAttribute('data-edit'); const r=state.registros.find(x=>x.id===id); if(!r) return; state.editId=r.id; state.nombre=r.nombre; state.area=r.area; state.lider=r.lider; state.dni=r.dni; state.celular=r.celular||""; state.asientoSel=r.asiento; state.showPasajeros=false; window.scrollTo({top:0,behavior:'smooth'}); render();}));
  document.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', ()=>{ const id=b.getAttribute('data-del'); const r=state.registros.find(x=>x.id===id); const doDel=()=> remove(ref(db, DB_PATH+'/'+id)); if(!state.isAdmin){ state.adminModal={message:`¿Eliminar a ${r.nombre} del asiento ${r.asiento}?`, action:doDel}; state.adminInput=""; state.adminError=""; render(); } else doDel(); }));
  document.querySelectorAll('[data-change]').forEach(b=> b.addEventListener('click', ()=>{ const id=b.getAttribute('data-change'); const r=state.registros.find(x=>x.id===id); const open=()=>{state.cambioId=id; state.nuevoAsiento=""; render();}; if(!state.isAdmin){ state.adminModal={message:`Cambiar asiento de ${r.nombre} requiere admin`, action:open}; state.adminInput=""; state.adminError=""; render(); } else open(); }));
  document.querySelectorAll('[data-closeInfo]').forEach(b=> b.addEventListener('click', ()=>{state.infoAsiento=null; render();}));
  document.getElementById('mInfo')?.addEventListener('click', e=>{ if(e.target.id==='mInfo'){state.infoAsiento=null; render();}});
  document.querySelectorAll('[data-editInfo]').forEach(b=> b.addEventListener('click', ()=>{ const id=b.getAttribute('data-editInfo'); const r=state.registros.find(x=>x.id===id); state.infoAsiento=null; state.editId=r.id; state.nombre=r.nombre; state.area=r.area; state.lider=r.lider; state.dni=r.dni; state.celular=r.celular||""; state.asientoSel=r.asiento; state.showMapa=false; window.scrollTo({top:0,behavior:'smooth'}); render();}));
  document.querySelectorAll('[data-changeInfo]').forEach(b=> b.addEventListener('click', ()=>{ const id=b.getAttribute('data-changeInfo'); const r=state.registros.find(x=>x.id===id); state.infoAsiento=null; const open=()=>{state.cambioId=id; state.nuevoAsiento=""; render();}; if(!state.isAdmin){ state.adminModal={message:`Cambiar asiento de ${r.nombre} requiere admin`, action:open}; render(); } else open(); }));
  document.querySelectorAll('[data-closeCambio]').forEach(b=> b.addEventListener('click', ()=>{state.cambioId=null; render();}));
  document.getElementById('selNuevo')?.addEventListener('change', e=>{state.nuevoAsiento=e.target.value; render();});
  document.querySelectorAll('[data-nuevo]').forEach(b=> b.addEventListener('click', ()=>{state.nuevoAsiento=b.getAttribute('data-nuevo'); render();}));
  document.getElementById('bConfirmCambio')?.addEventListener('click', ()=>{ if(!state.nuevoAsiento) return; const nuevo=Number(state.nuevoAsiento); const existe=state.registros.find(r=>r.asiento===nuevo); const r=state.registros.find(x=>x.id===state.cambioId); const doChange=()=>{ set(ref(db, DB_PATH+'/'+r.id), {...r, asiento:nuevo}); state.cambioId=null; state.nuevoAsiento=""; render(); }; if(existe && !state.isAdmin){ state.adminModal={message:`Asiento ${nuevo} ocupado por ${existe.nombre}. Requiere admin.`, action:doChange}; render(); return; } doChange(); });
  document.getElementById('bexp')?.addEventListener('click', ()=>{ const doExport=()=>{ const csv=["Nombre,Area,Lider,DNI,Celular,Asiento",...state.registros.map(r=>`"${r.nombre}","${r.area}","${r.lider}",${r.dni},"${r.celular||''}",${r.asiento}`)].join("\n"); const blob=new Blob([csv],{type:"text/csv"}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='bus_home.csv'; a.click(); }; if(!state.isAdmin){ state.adminModal={message:"Descargar el CSV requiere clave admin", action:doExport}; state.adminInput=""; state.adminError=""; render(); } else doExport(); });
  document.getElementById('bclear')?.addEventListener('click', ()=>{ const doClear=()=> remove(ref(db, DB_PATH)); if(!state.isAdmin){ state.adminModal={message:"¿Borrar TODO el bus? Requiere admin", action:doClear}; render(); } else doClear(); });
  document.querySelectorAll('[data-closeAdmin]').forEach(b=> b.addEventListener('click', ()=>{state.adminModal=null; render();}));
  document.querySelectorAll('[data-closeSuccess]').forEach(b=> b.addEventListener('click', ()=>{state.showSuccess=false; render();}));
  document.getElementById('mSuccess')?.addEventListener('click', e=>{ if(e.target.id==='mSuccess'){state.showSuccess=false; render();}});
  document.getElementById('btnTheme')?.addEventListener('click', ()=>{ state.theme = state.theme==='dark'?'light':'dark'; localStorage.setItem('bus_theme', state.theme); render(); });
  document.getElementById('btnMapa')?.addEventListener('click', ()=>{state.showMapa=true; render();});
  document.querySelectorAll('[data-closeMapa]').forEach(b=> b.addEventListener('click', ()=>{state.showMapa=false; render();}));
  document.getElementById('mMapa')?.addEventListener('click', e=>{ if(e.target.id==='mMapa'){state.showMapa=false; render();}});
  document.getElementById('btnPasajeros')?.addEventListener('click', ()=>{state.showPasajeros=true; render();});
  document.querySelectorAll('[data-closePasajeros]').forEach(b=> b.addEventListener('click', ()=>{state.showPasajeros=false; render();}));
  document.getElementById('mPasajeros')?.addEventListener('click', e=>{ if(e.target.id==='mPasajeros'){state.showPasajeros=false; render();}});
  document.getElementById('inpAdmin')?.addEventListener('input', e=> state.adminInput=e.target.value);
  document.getElementById('bAuth')?.addEventListener('click', ()=>{ if(state.adminInput===ADMIN_KEY){ const act=state.adminModal?.action; state.adminModal=null; state.adminInput=""; state.adminError=""; if(act) act(); render(); } else {state.adminError="Clave incorrecta"; render();}});
  document.getElementById('inpAdmin')?.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('bAuth')?.click(); });
}

// Firebase listener
onValue(ref(db, DB_PATH), snap=>{ state.fbConnected=true; const val=snap.val(); state.registros= val? Object.values(val):[]; if(!state.loading) render(); }, err=>{ state.fbConnected=false; render(); });

// splash timer
let cur=0; const dur=5000; const step=30; const total=dur/step;
const iv=setInterval(()=>{ cur++; state.progress=Math.min(100, Math.round((cur/total)*100)); if(state.progress>=100){ clearInterval(iv); state.fading=true; render(); setTimeout(()=>{state.loading=false; render();},520);} else if(state.loading) render(); }, step);
setTimeout(()=>{state.loading=false; render();},5500);
render();
</script>
<style>@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}</style>
</body>
</html>
